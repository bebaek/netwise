[project]
name = "netwise-backend"
version = "0.1.0"
description = "Netwise backend service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "pwdlib[argon2]>=0.2.1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=0.1.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
