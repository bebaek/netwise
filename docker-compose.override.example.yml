# Copy this file to docker-compose.override.yml and adjust paths for your machine.
# docker-compose.override.yml is ignored by git so local absolute paths stay private.

services:
  backend:
    environment:
      NETWISE_ENABLE_ADMIN_TOOLS: "true"
      NETWISE_IMPORT_ROOT: /import/fintrack
    volumes:
      # Mount exported/importable FinTrack data read-only into the backend container.
      - /path/to/fintrack/data:/import/fintrack:ro
