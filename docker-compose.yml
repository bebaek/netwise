services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netwise
      POSTGRES_PASSWORD: netwise
      POSTGRES_DB: netwise
    ports:
      - "127.0.0.1:${NETWISE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netwise -d netwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      NETWISE_DATABASE_URL: postgresql+psycopg://netwise:netwise@postgres:5432/netwise
      NETWISE_PUBLIC_SIGNUP: "false"
      NETWISE_SINGLE_HOUSEHOLD_MODE: "true"
      NETWISE_ENABLE_ADMIN_TOOLS: "false"
    ports:
      - "127.0.0.1:${NETWISE_BACKEND_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:${NETWISE_FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
